# Production deployment behind Caddy (automatic HTTPS with Let's Encrypt).
#
#   cp .env.production.example .env.production   # fill in the secrets
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Several app instances share live documents through Redis and the compile
# queue through PostgreSQL; scale with APP_REPLICAS / WORKER_REPLICAS.
# Only Caddy is reachable from outside (ports 80/443).
name: oversells-prod

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_URL: https://${OVERSELLS_DOMAIN:?set OVERSELLS_DOMAIN}
  COOKIE_SECURE: "true"
  TRUST_PROXY: "true"
  DATABASE_URL: postgresql://${POSTGRES_USER:-oversells}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-oversells}
  COMPILE_MODE: queue
  COMPILE_IMAGE: ${COMPILE_IMAGE:-oversells-texlive:latest}
  COMPILE_CONCURRENCY: ${COMPILE_CONCURRENCY:-2}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  STORAGE_DRIVER: s3
  S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
  S3_BUCKET: ${S3_BUCKET:-oversells}
  S3_REGION: ${S3_REGION:-us-east-1}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
  METRICS_TOKEN: ${METRICS_TOKEN:-}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-Oversells <no-reply@localhost>}
  AI_ENABLED: ${AI_ENABLED:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-30}

services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      OVERSELLS_DOMAIN: ${OVERSELLS_DOMAIN}
      # Let's Encrypt account e-mail (expiry notices).
      ACME_EMAIL: ${ACME_EMAIL:-admin@${OVERSELLS_DOMAIN}}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ubuntu:24.04}
    image: ${APP_IMAGE:-oversells-app:latest}
    command: ["app"]
    deploy:
      replicas: ${APP_REPLICAS:-2}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      <<: *app-env
    restart: unless-stopped

  worker:
    image: ${APP_IMAGE:-oversells-app:latest}
    command: ["worker"]
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    depends_on:
      app:
        condition: service_healthy
      compiler:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      OVERSELLS_ROLE: worker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  compiler:
    build: ./compiler
    image: ${COMPILE_IMAGE:-oversells-texlive:latest}
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oversells}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-oversells}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oversells} -d ${POSTGRES_DB:-oversells}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    restart: unless-stopped

  minio:
    image: ${MINIO_IMAGE:-minio/minio:latest}
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
  minio-data:
  caddy-data:
  caddy-config:
