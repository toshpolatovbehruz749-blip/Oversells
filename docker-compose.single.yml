# One-person server: Oversells behind Caddy (HTTPS) on a small VPS (4 GB RAM).
# Same as docker-compose.prod.yml but lean: one app instance, files on a local
# volume (no MinIO), no Redis. Set up with deploy/install.sh, or by hand:
#
#   docker compose -f docker-compose.single.yml --env-file .env.production up -d --build
name: oversells-single

x-app-env: &app-env
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  APP_URL: https://${OVERSELLS_DOMAIN:?set OVERSELLS_DOMAIN}
  COOKIE_SECURE: "true"
  TRUST_PROXY: "true"
  DATABASE_URL: postgresql://oversells:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/oversells
  COMPILE_MODE: queue
  COMPILE_IMAGE: oversells-texlive:latest
  COMPILE_CONCURRENCY: ${COMPILE_CONCURRENCY:-1}
  STORAGE_DRIVER: local
  DATA_DIR: /data
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASS: ${SMTP_PASS:-}
  MAIL_FROM: ${MAIL_FROM:-Oversells <no-reply@localhost>}
  AI_ENABLED: ${AI_ENABLED:-false}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-30}

services:
  caddy:
    image: caddy:2-alpine
    depends_on:
      app:
        condition: service_healthy
    environment:
      OVERSELLS_DOMAIN: ${OVERSELLS_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-admin@${OVERSELLS_DOMAIN}}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        BASE_IMAGE: ${BASE_IMAGE:-ubuntu:24.04}
    image: oversells-app:latest
    command: ["app"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
    volumes:
      - app-data:/data
    restart: unless-stopped

  worker:
    image: oversells-app:latest
    command: ["worker"]
    depends_on:
      app:
        condition: service_healthy
      compiler:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      OVERSELLS_ROLE: worker
    volumes:
      - app-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  compiler:
    build: ./compiler
    image: oversells-texlive:latest
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oversells
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: oversells
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oversells -d oversells"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
  app-data:
  caddy-data:
  caddy-config:
