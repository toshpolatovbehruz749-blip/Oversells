# Oversells on your own computer, for you alone (started by the files in desktop/).
# Reachable only from this computer: http://localhost:3000
# (desktop/phone.sh on opens it to phones and tablets on the same Wi-Fi).
# Everything restarts with Docker Desktop, so it is there whenever Docker runs.
name: oversells-desktop

x-app-env: &app-env
  DATABASE_URL: postgresql://oversells:oversells-desktop@db:5432/oversells
  APP_URL: http://localhost:${APP_PORT:-3000}
  COMPILE_MODE: queue
  COMPILE_IMAGE: oversells-texlive:latest
  COMPILE_CONCURRENCY: "1"
  # Big books (1000+ pages, many pictures): long compiles, more memory and room.
  COMPILE_TIMEOUT_MS: ${COMPILE_TIMEOUT_MS:-1800000}
  COMPILE_MEMORY_MB: ${COMPILE_MEMORY_MB:-4096}
  COMPILE_CPUS: ${COMPILE_CPUS:-2}
  COMPILE_WORKDIR_MB: ${COMPILE_WORKDIR_MB:-2048}
  COMPILE_MAX_OUTPUT_BYTES: ${COMPILE_MAX_OUTPUT_BYTES:-629145600}
  MAX_PROJECT_BYTES: ${MAX_PROJECT_BYTES:-1073741824}
  MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-104857600}
  MAX_TEXT_FILE_BYTES: ${MAX_TEXT_FILE_BYTES:-16777216}
  MAX_FILES_PER_PROJECT: ${MAX_FILES_PER_PROJECT:-5000}
  # Daily ZIP of all projects in a folder on this computer (kept 14 days).
  BACKUP_DIR: /backups
  BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
  STORAGE_DRIVER: local
  DATA_DIR: /data
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  AI_ENABLED: ${AI_ENABLED:-false}
  PAGE_DESIGN_ENABLED: ${PAGE_DESIGN_ENABLED:-true}
  DESKTOP_STATE_DIR: /desktop-state
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

services:
  app:
    build:
      context: .
      # desktop/update-offline.sh builds on top of the installed image when
      # Docker Hub (ubuntu, node) cannot be reached.
      args:
        BASE_IMAGE: ${OVERSELLS_BASE_IMAGE:-ubuntu:24.04}
        NODE_IMAGE: ${OVERSELLS_NODE_IMAGE:-node:22-bookworm-slim}
    image: oversells-app:latest
    command: ["app"]
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    volumes:
      - app-data:/data
      # The launchers set OVERSELLS_BACKUP_DIR to Documents/Oversells zaxira.
      - "${OVERSELLS_BACKUP_DIR:-./backups}:/backups"
      # What the launchers found on this computer (desktop/mac/indesign-state.sh).
      - ./desktop/state:/desktop-state:ro
    ports:
      # Only this computer can open it, unless OVERSELLS_BIND=0.0.0.0 is set in
      # .env (desktop/phone.sh on): then the phones on the same Wi-Fi can too.
      - "${OVERSELLS_BIND:-127.0.0.1}:${APP_PORT:-3000}:3000"
    restart: unless-stopped

  worker:
    image: oversells-app:latest
    command: ["worker"]
    depends_on:
      app:
        condition: service_healthy
      compiler:
        condition: service_completed_successfully
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
      OVERSELLS_ROLE: worker
    volumes:
      - app-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  compiler:
    build: ./compiler
    image: oversells-texlive:latest
    entrypoint: ["true"]
    network_mode: none
    restart: "no"

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: oversells
      POSTGRES_PASSWORD: oversells-desktop
      POSTGRES_DB: oversells
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oversells -d oversells"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  db-data:
  app-data:
